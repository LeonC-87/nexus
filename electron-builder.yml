appId: com.nexus.app
productName: Nexus
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
# better-sqlite3 is a native module - its compiled .node binary can't be loaded
# from inside the asar archive, so it must be unpacked to a real path on disk.
asarUnpack:
  - '**/node_modules/better-sqlite3/**/*'
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
  identity: null
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
